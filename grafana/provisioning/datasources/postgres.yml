apiVersion: 1

datasources:
  - name: OEE PostgreSQL
    uid: oee-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB}
    user: oee_grafana
    secureJsonData:
      password: ${OEE_GRAFANA_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
